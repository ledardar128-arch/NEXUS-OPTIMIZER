name: Build NEXUS Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish standalone app
        shell: pwsh
        run: |
          dotnet publish src/NexusOptimizer/NexusOptimizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/NEXUS.iss
          if (!(Test-Path "artifacts/NEXUS_Setup.exe")) { throw "Installer was not generated." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_Setup
          path: artifacts/NEXUS_Setup.exe
          if-no-files-found: error
